      else if (e.key === "Home") j = 0;
      else if (e.key === "End") j = n - 1;
      if (j >= 0) { e.preventDefault(); showTab(j, true); tabButtons[j].focus(); }
    });
    tabsEl.appendChild(b);
    tabButtons.push(b);
    var p = el("section", "panel");
    p.id = "panel-" + i;
    p.setAttribute("role", "tabpanel");
    p.setAttribute("aria-labelledby", "tab-" + i);
    p.hidden = true;
    panelsEl.appendChild(p);
    panels.push(p);
  });
  function showTab(i, remember) {
    tabButtons.forEach(function (b, k) {
      b.setAttribute("aria-selected", k === i ? "true" : "false");
      b.tabIndex = k === i ? 0 : -1;
      panels[k].hidden = k !== i;
    });
    if (remember) { try { localStorage.setItem("drive-plan-page-tab", String(i)); } catch (e) {} }
  }

  /* ---------- tab 1: Plan now ---------- */
  var needsList = el("ul", "stack"), settledList = el("ul", "stack");
  (function buildNow() {
    var p = panels[0];
    if ((D.flow || []).length) {
      var s = el("div", "section");
      s.appendChild(el("h2", "", "How it works"));
      var ol = el("ol", "flow");
      D.flow.forEach(function (b, i) {
        var li = el("li");
        add(li, el("span", "num", String(i + 1)), el("strong", "", b.title), el("span", "muted", b.text));
        ol.appendChild(li);
      });
      s.appendChild(ol);
      p.appendChild(s);
    }
    var n = el("div", "section");
    n.appendChild(el("h2", "", "Needs you"));
    n.appendChild(needsList);
    p.appendChild(n);
    var st = el("div", "section");
    st.appendChild(el("h2", "", "Settled"));
    st.appendChild(settledList);
    p.appendChild(st);
    var o = el("div", "section");
    o.appendChild(el("h2", "", "Out this round"));
    if ((D.out || []).length) {
      var ul = el("ul", "list");
      D.out.forEach(function (t) { ul.appendChild(el("li", "", t)); });
      o.appendChild(ul);
    } else {
      o.appendChild(el("p", "muted", "Nothing is held back."));
    }
    p.appendChild(o);
  })();

  function renderNow() {
    needsList.textContent = "";
    settledList.textContent = "";
    var open = questions.filter(isOpen);
    if (!open.length) {
      var none = el("li", "muted", "Nothing needs you right now.");
      needsList.appendChild(none);
    }
    open.forEach(function (q) {
      var li = el("li");
      var b = el("button", "jump");
      b.type = "button";
      add(b, el("span", "mono", q.id), el("span", "", q.q));
      b.addEventListener("click", function () { jumpTo(q.id); });
      li.appendChild(b);
      needsList.appendChild(li);
    });
    var any = false;
    questions.forEach(function (q) {
      if (isOpen(q)) return;
      any = true;
      var s = state[q.id] || {};
      var who = q.status === "settled" ? (s.by || "owner") : "you, marked on this page";
      var li = el("li", "settled-row");
      add(li, el("span", "", q.id + " " + q.q),
        el("span", "answer-line", optText(q, choiceOf(q))),
        el("span", "meta", who + (s.at ? " · " + day(s.at) : "")));
      settledList.appendChild(li);
    });
    defaults.forEach(function (d) {
      var s = state[d.id];
      if (!s && choiceOf(d) === d.default) return;
      if (s && !d.answer && s.choice === d.default && !s.note) return;
      any = true;
      var li = el("li", "settled-row");
      add(li, el("span", "", d.id + " " + d.label),
        el("span", "answer-line", optText(d, choiceOf(d))),
        el("span", "meta", ((s && s.by) || "you, marked on this page") + (s && s.at ? " · " + day(s.at) : "")));
      settledList.appendChild(li);
    });
    if (!any) settledList.appendChild(el("li", "muted", "Nothing is settled yet."));
    badge.textContent = String(open.length);
    badge.setAttribute("aria-label", open.length + " open");
    renderBanner(open);
  }

  /* ---------- needs banner ---------- */
  function renderBanner(open) {
    var b = $("needs-banner");
    b.textContent = "";
    var stuck = (D.steps || []).map(function (st) { return "s" + st.n; }).filter(function (k) { return progress[k]; }).filter(function (k) { return progress[k].status === "blocked" || progress[k].status === "failed"; });
    var msg, kind = "", target = -1, label = "";
    if (open.length) {
      kind = "open";
      msg = open.length + (open.length === 1 ? " decision is waiting for you." : " decisions are waiting for you.");
      target = 1; label = "Go to Decide";
    } else if (stuck.length) {
      kind = "blocked";
      msg = "The build needs you: " + stuck.length + (stuck.length === 1 ? " step is" : " steps are") + " blocked or failed.";
      target = 4; label = "See Progress";
    } else {
      msg = "Nothing needs you right now. Reply go in chat when you are ready.";
    }
    b.className = "needs" + (kind ? " " + kind : "");
    b.appendChild(el("span", "msg", msg));
    if (target >= 0) {
      var go = el("button", "btn", label);
      go.type = "button";
      go.addEventListener("click", function () { showTab(target, true); });
      b.appendChild(go);
    }
  }

  /* ---------- tab 2: Decide ---------- */
  var cardRefs = {};   // id -> {card, buttons:{letter:btn}, note, line}
  var defaultRefs = {};
  var LABELS = [["today", "Today"], ["why", "Why it matters"], ["pick", "My pick"], ["get", "What we get"], ["skip", "If we skip it"]];

  function optButton(it, o, cls, isRec, isDef) {
    var b = el("button", "opt");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.appendChild(el("span", "letter", o.l));
    b.appendChild(el("span", "txt", o.t));
    if (isRec) b.appendChild(el("span", "tag pick", "my pick"));
    if (isDef) b.appendChild(el("span", "tag", "default"));
    return b;
  }

  (function buildDecide() {
    var p = panels[1];
    var qs = el("div", "section");
    qs.appendChild(el("h2", "", "Questions"));
    if (!questions.length) qs.appendChild(el("p", "muted", "There are no questions for this plan."));
    questions.forEach(function (q) {
      var card = el("article", "card");
      card.id = "card-" + q.id;
      card.tabIndex = -1;
      var head = el("div", "card-head");
      head.appendChild(el("span", "mono muted", q.id));
      head.appendChild(el("h3", "", q.q));
      (q.touches || []).forEach(function (t) { head.appendChild(el("span", "tag", "touches " + t)); });
      card.appendChild(head);
      var dl = el("dl", "facts");
      LABELS.forEach(function (pair) {
        dl.appendChild(el("dt", "", pair[1]));
        dl.appendChild(el("dd", "", q[pair[0]]));
      });
      card.appendChild(dl);
      var line = el("p", "answer-line");
      card.appendChild(line);
      var opts = el("div", "opts");
      opts.setAttribute("role", "group");
      opts.setAttribute("aria-label", "Options for " + q.id);
      var buttons = {};
      q.options.forEach(function (o) {
        var b = optButton(q, o, "", o.l === q.recommended, false);
        b.addEventListener("click", function () {
          var cur = choiceOf(q);
          setAnswer(q.id, { choice: cur === o.l ? "" : o.l });
        });
        opts.appendChild(b);
        buttons[o.l] = b;
      });
      card.appendChild(opts);
      var nid = "note-" + q.id;
      var lab = el("label", "note-label", "Note (optional)");
      lab.setAttribute("for", nid);
      var ta = el("textarea", "note");
      ta.id = nid;
      ta.addEventListener("input", function () { setAnswer(q.id, { note: ta.value }, true); });
      add(card, lab, ta);
      qs.appendChild(card);
      cardRefs[q.id] = { card: card, buttons: buttons, note: ta, line: line };
    });
    p.appendChild(qs);

    var ds = el("div", "section");
    ds.appendChild(el("h2", "", "My defaults"));
    ds.appendChild(el("p", "muted", "Each default is my pick, not a neutral state. Flip the ones you disagree with."));
    var wrap = el("div", "defaults");
    defaults.forEach(function (d) {
      var row = el("div", "drow");
      var lab = el("div", "dl");
      add(lab, el("span", "mono muted", d.id + " "), el("strong", "", d.label));
      row.appendChild(lab);
      var pills = el("div", "pills");
      pills.setAttribute("role", "group");
      pills.setAttribute("aria-label", d.label);
      var buttons = {};
      d.options.forEach(function (o) {
        var b = optButton(d, o, "", false, o.l === d.default);
        b.addEventListener("click", function () { setAnswer(d.id, { choice: o.l }); });
        pills.appendChild(b);
        buttons[o.l] = b;
      });
      row.appendChild(pills);
      wrap.appendChild(row);
      defaultRefs[d.id] = { buttons: buttons };
    });
    ds.appendChild(wrap);
    p.appendChild(ds);
  })();

  function renderDecide() {
    questions.forEach(function (q) {
      var r = cardRefs[q.id], c = choiceOf(q), s = state[q.id] || {};
      Object.keys(r.buttons).forEach(function (l) { r.buttons[l].setAttribute("aria-pressed", l === c ? "true" : "false"); });
      if (document.activeElement !== r.note && r.note.value !== noteOf(q)) r.note.value = noteOf(q);
      if (c) {
        var who = q.status === "settled" ? (s.by || "owner") : "you";
        r.line.textContent = (q.status === "settled" ? "Settled: " : "Marked: ") + optText(q, c) + " · " + who + (s.at ? " · " + day(s.at) : "");
      } else {
        r.line.textContent = "";
      }
    });
    defaults.forEach(function (d) {
      var r = defaultRefs[d.id], c = choiceOf(d);
      Object.keys(r.buttons).forEach(function (l) { r.buttons[l].setAttribute("aria-pressed", l === c ? "true" : "false"); });
    });
  }

  function jumpTo(id) {
    showTab(1, true);
    var r = cardRefs[id];
    if (!r) return;
    r.card.scrollIntoView({ block: "start" });
    r.card.focus({ preventScroll: true });
  }

  /* ---------- tab 3: Steps ---------- */
  (function buildSteps() {
    var p = panels[2];
    var s = el("div", "section");
    s.appendChild(el("h2", "", "Steps"));
    var ol = el("ol", "steps");
    (D.steps || []).forEach(function (st) {
      var li = el("li");
      add(li, el("span", "num", String(st.n)), el("strong", "", st.title), el("span", "muted", st.plain));
      ol.appendChild(li);
    });
    s.appendChild(ol);
    p.appendChild(s);
    var t = el("div", "section");
    add(t, el("h2", "", "How we test it"), el("p", "", D.test));
    p.appendChild(t);
    var w = el("div", "section");
    add(w, el("h2", "", "Where it ships"), el("p", "", D.ships));
    p.appendChild(w);
  })();

  /* ---------- tab 4: History ---------- */
  (function buildHistory() {
    var p = panels[3];
    var h = el("div", "section");
    h.appendChild(el("h2", "", "History"));
    var list = (D.history || []).map(function (e, i) { return { e: e, i: i }; });
    list.sort(function (a, b) { return a.e.at < b.e.at ? 1 : a.e.at > b.e.at ? -1 : b.i - a.i; });
    if (!list.length) h.appendChild(el("p", "muted", "No history yet."));
    list.forEach(function (x) {
      var e = x.e;
      var box = el("article", "entry" + (e.superseded_by ? " old" : ""));
      var meta = el("div", "meta", e.at + " · " + e.by + " · " + e.id);
      var txt = el("p", "etext", e.text);
      add(box, meta, txt);
      if (e.quote) box.appendChild(el("blockquote", "", e.quote));
      if (e.superseded_by) box.appendChild(el("p", "meta", "superseded by " + e.superseded_by));
      h.appendChild(box);
    });
    p.appendChild(h);
    var v = el("div", "section");
    v.appendChild(el("h2", "", "Versions"));
    versions.slice().reverse().forEach(function (ver) {
      var row = el("div", "vrow");
      add(row, el("strong", "", "v" + ver.n), el("span", "meta", ver.date), el("span", "", ver.label));
      v.appendChild(row);
    });
    p.appendChild(v);
  })();

  /* ---------- tab 5: Progress ---------- */
  var progressList = el("div", "stack");
  (function buildProgress() {
    var p = panels[4];
    var s = el("div", "section");
    s.appendChild(el("h2", "", "Progress"));
    s.appendChild(el("p", "muted sm", "Each step shows the state drive-build last wrote for it. Nothing here is typed by hand."));
    s.appendChild(progressList);
    p.appendChild(s);
  })();

  function renderProgress() {
    progressList.textContent = "";
    var steps = D.steps || [];
    steps.forEach(function (st) {
      var pr = progress["s" + st.n] || {};
      var status = STATUS_WORDS[pr.status] || "pending";
      var row = el("div", "prow");
      add(row, el("span", "num", String(st.n)), el("strong", "ptitle", st.title), el("span", "status " + status, status));
      if (pr.at) row.appendChild(el("span", "meta", day(pr.at)));
      if (pr.note) row.appendChild(el("span", "pnote", pr.note));
      progressList.appendChild(row);
    });
    if (!steps.length) progressList.appendChild(el("p", "muted", "There are no steps yet."));
  }

  function applyProgress(snap) {
    snap.docs.forEach(function (d) {
      if (d.exists === false) { delete progress[d.id]; return; }
      var v = d.data();
      if (!v || typeof v.status !== "string") return;
      progress[d.id] = { status: v.status, note: typeof v.note === "string" ? v.note.slice(0, 400) : "", at: typeof v.at === "string" ? v.at : "" };
    });
    renderProgress();
    renderNow();
  }

  /* ---------- answers ---------- */
  function setSave(t) { $("save").textContent = t; }

  function setAnswer(id, patch, debounce) {
    var it = items[id];
    var s = state[id] || { choice: choiceOf(it), note: "", at: "", by: "" };
    if (patch.choice !== undefined) s.choice = patch.choice;
    if (patch.note !== undefined) s.note = patch.note;
    s.by = "you";
    state[id] = s;
    renderNow();
    renderDecide();
    if (debounce) {
      clearTimeout(saveTimers[id]);
      saveTimers[id] = setTimeout(function () { persist(id); }, 600);
    } else {
      persist(id);
    }
  }

  function persist(id) {
    var s = state[id];
    s.at = new Date().toISOString();
    if (!db) { setSave("not saved here"); return; }
    pending++;
    setSave("saving…");
    var doc = { choice: s.choice || "", note: s.note || "", at: s.at };
    var done = function (ok) {
      pending--;
      if (!ok) setSave("not saved, try again");
      else if (pending === 0) setSave("saved");
    };
    try {
      db.collection("answers").doc(id).set(doc).then(function () { done(true); }, function () { done(false); });
    } catch (e) { done(false); }
  }

  function applySnapshot(snap) {
    if (pending > 0) return;
    snap.docs.forEach(function (d) {
      if (d.exists === false) return;
      var it = items[d.id], v = d.data();
      if (!it || !v) return;
      var s = state[d.id] || { choice: choiceOf(it), note: "", at: "", by: "" };
      if (typeof v.choice === "string" && (v.choice === "" || it.options.some(function (o) { return o.l === v.choice; }))) {
        if (!(v.choice === "" && it.default !== undefined)) s.choice = v.choice;
      }
      if (typeof v.note === "string") s.note = v.note;
      if (typeof v.at === "string") s.at = v.at;
      s.by = s.by || "you";
      state[d.id] = s;
    });
    renderNow();
    renderDecide();
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error("timeout")); }, ms);
      promise.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }

  async function connect() {
    try {
      db = await withTimeout(Promise.resolve(window.claude && window.claude.use ? window.claude.use("db") : null), 10000);
    } catch (e) { db = null; }
    if (!db) {
      $("nodb").hidden = false;
      setSave("not saved here");
      return;
    }
    try {
      db.collection("answers").onSnapshot(applySnapshot, function () { setSave("offline"); });
    } catch (e) { /* the page still works without live answers */ }
    try {
      db.collection("progress").onSnapshot(applyProgress, function () { /* Progress stays at pending */ });
    } catch (e) { /* the page still works without live progress */ }
  }

  /* ---------- copy answers ---------- */
  function answersText() {
    var lines = [D.title + " v" + D.version + ", my answers"];
    function one(id, choice, note) {
      note = (note || "").trim().replace(/\s*[\r\n]+\s*/g, " / ");
      lines.push(id + ": " + (choice || "no choice") + (note ? " | " + note : ""));
    }
    questions.forEach(function (q) {
      var c = choiceOf(q), n = noteOf(q).trim();
      if (c || n) one(q.id, c, n);
    });
    defaults.forEach(function (d) {
      if (choiceOf(d) !== d.default) one(d.id, choiceOf(d), noteOf(d));
    });
    return lines.join("\n");
  }
  $("copy").addEventListener("click", function () {
    var text = answersText();
    var fb = $("fallback"), ft = $("fallback-text");
    function fallback() {
      ft.value = text;
      fb.hidden = false;
      ft.focus();
      ft.select();
      setSave("select the text and copy it");
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        fb.hidden = true;
        setSave("answers copied");
      }, fallback);
    } catch (e) { fallback(); }
  });

  /* ---------- start ---------- */
  var start = 0;
  try {
    var saved = parseInt(localStorage.getItem("drive-plan-page-tab"), 10);
    if (saved >= 0 && saved < TAB_NAMES.length) start = saved;
  } catch (e) {}
  renderProgress();
  renderNow();
  renderDecide();
  showTab(start, false);
  connect();
})();
</script>
