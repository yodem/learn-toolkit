name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'ruff==0.8.6'
      - run: bash scripts/verify.sh

  # A new push or edit voids the maintainer's exemption label; it must be re-applied after the latest push.
  test-integrity-label:
    name: test-integrity-label
    if: github.event_name == 'pull_request' && contains(fromJSON('["synchronize","reopened","edited"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: remove tests-removed label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          out="$(gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/tests-removed" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if printf '%s' "$out" | grep -q 'HTTP 404'; then
              echo "label not present (ok)"
            else
              printf '%s\n' "$out" >&2
              exit "$rc"
            fi
          fi

  # Listing runs the PR's own test code, so it gets a read-only token, no PR text and no secrets.
  test-integrity-list:
    name: test-integrity-list
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # INSTALL HEAD DEPENDENCIES HERE (learn-toolkit needs none; other repos install what their listers import).
      - name: list head tests with the base gate set
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          listing="$(git ls-tree --name-only "origin/$BASE_REF" scripts/test_integrity.py)"
          if [ -z "$listing" ]; then
            echo "BOOTSTRAP: base has no scripts/test_integrity.py; using the PR copy of the core"
            TI_DIR="$GITHUB_WORKSPACE/scripts"
          else
            git cat-file -e "origin/$BASE_REF:scripts/test_integrity.py"
            mkdir -p "$RUNNER_TEMP/ti"
            git archive "origin/$BASE_REF" scripts | tar -x -C "$RUNNER_TEMP/ti"
            TI_DIR="$RUNNER_TEMP/ti/scripts"
          fi
          python3 "$TI_DIR/test_integrity.py" list --config "$TI_DIR/test-integrity.json" --tree . --out "$RUNNER_TEMP/head-list.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: ti-head-list
          path: ${{ runner.temp }}/head-list.jsonl
          retention-days: 1
          if-no-files-found: error

  # The judge never executes head-tree code, except in the BOOTSTRAP case (base has no gate yet; the PR's core
  # and config run, a documented trust exception reviewed by hand).
  test-integrity:
    name: test-integrity
    needs: [test-integrity-label, test-integrity-list]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: fail closed unless the label reset and the head listing succeeded
        env:
          LABEL_JOB_RESULT: ${{ needs.test-integrity-label.result }}
          LIST_JOB_RESULT: ${{ needs.test-integrity-list.result }}
        run: |
          if [ "$LIST_JOB_RESULT" != "success" ]; then
            echo "test-integrity: head listing job did not succeed ($LIST_JOB_RESULT); refusing to judge" >&2
            exit 2
          fi
          if [ "$LABEL_JOB_RESULT" != "success" ] && [ "$LABEL_JOB_RESULT" != "skipped" ]; then
            echo "test-integrity: label reset job failed; refusing to judge with a possibly stale label" >&2
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ti-head-list
          path: ${{ runner.temp }}/head-list
      - name: compare test lists (base copy of the core judges the PR)
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" "origin/$BASE_REF"
          # Distinguish "absent on base" from other git errors via ls-tree output, not by ||.
          listing="$(git ls-tree --name-only "origin/$BASE_REF" scripts/test_integrity.py)"
          if [ -z "$listing" ]; then
            echo "BOOTSTRAP: base has no scripts/test_integrity.py; using the PR copy of the core"
            TI_DIR="$GITHUB_WORKSPACE/scripts"
          else
            git cat-file -e "origin/$BASE_REF:scripts/test_integrity.py"
            mkdir -p "$RUNNER_TEMP/ti"
            git archive "origin/$BASE_REF" scripts | tar -x -C "$RUNNER_TEMP/ti"
            TI_DIR="$RUNNER_TEMP/ti/scripts"
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name]' > "$RUNNER_TEMP/labels.json"
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events" > "$RUNNER_TEMP/events.json"
          python3 "$TI_DIR/test_integrity.py" run --config "$TI_DIR/test-integrity.json" \
            --base-tree "$RUNNER_TEMP/base" --head-tree "$GITHUB_WORKSPACE" --base-ref "origin/$BASE_REF" \
            --head-list "$RUNNER_TEMP/head-list/head-list.jsonl" \
            --pr-body-file "$RUNNER_TEMP/pr-body.txt" --labels-file "$RUNNER_TEMP/labels.json" \
            --label-events-file "$RUNNER_TEMP/events.json"
